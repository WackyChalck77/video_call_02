<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UDP Conference</title>
    <link rel="stylesheet" href="/css/app.css">
    
    <!-- iOS Safari: принудительный redirect на HTTPS для non-localhost -->
    <script>
        (function() {
            if (location.protocol !== 'https:' && 
                location.hostname !== 'localhost' && 
                location.hostname !== '127.0.0.1') {
                location.href = 'https:' + window.location.href.substring(window.location.protocol.length);
            }
        })();
    </script>
</head>
<body>
    <h2>VideoCall 2.0 - конференция</h2>

    <div id="joinPanel">
        <select id="qualitySelect">
            <option value="low">Низкое (до 320×180, 15fps)</option>
            <option value="medium">Среднее (до 640×360, 25fps)</option>
            <option value="high">Высокое (до 1024×576, 30fps)</option>
            <option value="ultra">Ультра (до 1280×720, 30fps)</option>
        </select>
        <br>
        <button id="joinBtn">Присоединиться</button>
        <button id="leaveBtn" class="hidden">Отключиться</button>
        <div id="muteBtns" class="hidden">
            <button id="videoMuteBtn"> Видео вкл</button>
            <button id="audioMuteBtn">Микрофон вкл</button>
        </div>
        <div id="status"></div>
    </div>

    <div id="videos"></div>

    <script src="/libs/ion-sdk.min.js"></script>
    <script src="/libs/json-rpc.min.js"></script>
    <script type="module" src="/js/main.js"></script>
</body>
</html>
