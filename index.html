<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UDP Conference</title>
    <style>
        body { font-family: sans-serif; padding: 16px; }
        video { width: 100%; max-width: 360px; background: #000; margin: 4px; }
        button { padding: 12px 24px; font-size: 16px; margin: 8px 0; }
        select { padding: 8px; font-size: 16px; }
        #videos { display: flex; flex-wrap: wrap; }
        #status { color: #666; margin: 8px 0; font-size: 14px; }
    </style>
</head>
<body>
    <h2>Конференция</h2>
    
    <div id="joinPanel">
        <select id="qualitySelect">
            <option value="low">Низкое (320x240, 10fps)</option>
            <option value="medium" selected>Сбалансированное (640x480, 20fps)</option>
            <option value="high">Высокое (1280x720, 30fps)</option>
        </select>
        <br>
        <button id="joinBtn">Присоединиться</button>
         <button id="leaveBtn" style="display:none;">Отключиться</button>
        <div id="status"></div>
    </div>

    <div id="videos"></div>
<script src="/libs/ion-sdk.min.js"></script>
<script src="/libs/json-rpc.min.js"></script>

    <script type="module">
        // node_modules/ion-sdk-js/lib — это CommonJS (require/exports), браузер его не импортирует.
        // Берём классы из UMD-бандлов, подключённых выше как обычные скрипты.
        const { Client, LocalStream } = globalThis.IonSDK;
        const { IonSFUJSONRPCSignal } = globalThis.Signal;

        if (!Client || !LocalStream || !IonSFUJSONRPCSignal) {
            setStatus('SDK не загрузился: проверьте /libs/ion-sdk.min.js и /libs/json-rpc.min.js');
            throw new Error('ion-sdk UMD bundles are missing');
        }

        console.log('SDK loaded:', { Client, LocalStream, IonSFUJSONRPCSignal });

        const qualityPresets = {
            low:    { width: { ideal: 320 },  height: { ideal: 240 },  frameRate: { ideal: 10, max: 30 } },
            medium: { width: { ideal: 640 },  height: { ideal: 480 },  frameRate: { ideal: 20, max: 30 } },
            high:   { width: { ideal: 1280 }, height: { ideal: 720 },  frameRate: { ideal: 30, max: 60 } }
        };

        const roomId = 'demo-room';
        let client;
        let signal;
          let localStream = null;

        // key -> { stream, tracks:Set<MediaStreamTrack>, mutedAt }.
        // Ключ совпадает с id элемента <video> ('video-' + key), поэтому по нему
        // и удаляем фрейм, когда дорожка ушла.
        const remoteStreams = new Map();

        function setStatus(text) {
            document.getElementById('status').textContent = text;
            console.log('STATUS:', text);
        }

        // Частая причина «звука нет» на самом деле не в воспроизведении: если у
        // публикующего нет микрофона, он вообще не отправляет аудиодорожку, и слышать
        // его не сможет никто. Печатаем, что реально видит браузер.
        async function logAudioDevices() {
            try {
                const devs = await navigator.mediaDevices.enumerateDevices();
                const kinds = {};
                devs.forEach((d) => { kinds[d.kind] = (kinds[d.kind] || 0) + 1; });
                console.warn('Устройства ввода/вывода:', JSON.stringify(kinds),
                    '| микрофонов:', kinds.audioinput || 0);
            } catch (err) {
                console.warn('enumerateDevices недоступен:', err.message);
            }
        }

        async function acquireLocalStream(videoConstraints) {
            try {
                const stream = await LocalStream.getUserMedia({
                    audio: true,
                    video: videoConstraints
                });
                setStatus('Микрофон и камера подключены');
                return stream;
            } catch (err) {
                console.warn('A/V failed:', err.name, err.message);
                logAudioDevices();
            }

            try {
                const stream = await LocalStream.getUserMedia({
                    audio: false,
                    video: videoConstraints
                });
                setStatus('Камера подключена (микрофон не найден)');
                return stream;
            } catch (err) {
                console.warn('Video-only failed:', err.name, err.message);
            }

            try {
                const stream = await LocalStream.getUserMedia({
                    audio: true,
                    video: false
                });
                setStatus('Микрофон подключён (камера не найдена)');
                return stream;
            } catch (err) {
                console.warn('Audio-only failed:', err.name, err.message);
            }

            setStatus('Нет доступных устройств — режим только приёма');
            return null;
        }

        // WebSocket в конструкторе сигнала создаётся сразу, но открывается асинхронно.
        // SDK шлёт join/trickle без проверки readyState, поэтому любой send() до события
        // open падает с "InvalidStateError: ... Still in CONNECTING state".
        function waitSignalOpen(signal, timeoutMs) {
            return new Promise((resolve, reject) => {
                let settled = false;
                const timer = setTimeout(() => {
                    if (settled) return;
                    settled = true;
                    reject(new Error('Сигнал не открылся за ' + timeoutMs + ' мс'));
                }, timeoutMs || 8000);

                signal.onopen = () => {
                    if (settled) return;
                    settled = true;
                    clearTimeout(timer);
                    console.log('Signaling connected');
                    resolve();
                };
                signal.onerror = (e) => {
                    console.error('Signaling error:', e);
                    if (settled) return;
                    settled = true;
                    clearTimeout(timer);
                    reject(new Error('WebSocket error — проверь адрес wss://…:8443/ws и журнал ion-sfu'));
                };
                signal.onclose = (e) => {
                    console.log('Signaling closed, code=' + e.code);
                    if (settled) return;
                    settled = true;
                    clearTimeout(timer);
                    reject(new Error('WebSocket закрыт до открытия (code ' + e.code + ')'));
                };
            });
        }

        // Удаляем фрейм участника: гасим воспроизведение, отвязываем поток, убираем узел.
        function removeVideo(key, reason) {
            const rec = remoteStreams.get(key);
            if (rec) {
                rec.tracks.forEach((t) => {
                    t.onended = null;
                    t.onmute = null;
                    t.onunmute = null;
                });
                rec.stream.onaddtrack = null;
                rec.stream.onremovetrack = null;
                remoteStreams.delete(key);
            }
            // Ключ в prevStats — с префиксом 'stats_', см. collectStats
            prevStats.delete('stats_' + key);
            // Удаляем обёртку ЦЕЛИКОМ — в ней лежат и <video>, и таблица статистики.
            // Если снять только <video>, wrapper останется в DOM, и следующий addVideo
            // решит, что элемент уже создан: getElementById('video-...') вернёт null
            // и повторный вход упадёт с "Cannot read properties of null".
            const wrap = document.getElementById('wrapper-' + key);
            const el = document.getElementById('video-' + key);
            if (el) {
                el.pause();
                el.srcObject = null;
                el.load();
            }
            if (wrap) {
                wrap.remove();
            } else if (el) {
                el.remove();
            }
            console.log('Removed video element:', key, '-', reason);
        }

        function removeAllRemote(reason) {
            Array.from(remoteStreams.keys()).forEach((key) => removeVideo(key, reason));
        }

        // Убираем фрейм, когда от потока не осталось живых дорожек.
        function dropTrack(key, track, reason) {
            const rec = remoteStreams.get(key);
            if (!rec) return;
            rec.tracks.delete(track);
            if (rec.tracks.size === 0) {
                removeVideo(key, reason);
            } else {
                console.log('Track gone:', track.kind, 'from', key, '- осталось', rec.tracks.size, '(' + reason + ')');
            }
        }

        // Смотрим за отдельной дорожкой: ended — транcивер остановлен,
        // mute — RTP перестал приходить (кадров нет, но дорожка ещё «живая»).
        function watchTrack(key, rec, track) {
            rec.tracks.add(track);
            track.onended = () => dropTrack(key, track, 'track ended');
            track.onmute = () => {
                rec.mutedAt = rec.mutedAt || Date.now();
                console.log('Track muted:', track.kind, key);
            };
            track.onunmute = () => {
                rec.mutedAt = 0;
                console.log('Track unmuted:', track.kind, key);
            };
        }

        // ion-sfu при уходе пиббера может как пересогласовать sub-пир (тогда дорожка
        // удаляется из MediaStream), так и просто перестать слать RTP (тогда только mute).
        // Поэтому страхуемся таймером: все дорожки потока заглушены дольше STALE_MS — выкидываем.
        const STALE_MS = 5000;
        setInterval(() => {
            const now = Date.now();
            remoteStreams.forEach((rec, key) => {
                const tracks = Array.from(rec.tracks);
                if (tracks.length === 0) {
                    removeVideo(key, 'no tracks left');
                    return;
                }
                const allStale = tracks.every((t) => t.muted || t.readyState !== 'live');
                if (!allStale) {
                    rec.mutedAt = 0;
                    return;
                }
                rec.mutedAt = rec.mutedAt || now;
                if (now - rec.mutedAt >= STALE_MS) {
                    removeVideo(key, 'all tracks muted for ' + STALE_MS + 'ms');
                }
            });
        }, 2000);

        function watchPeer(label, pc) {
            if (!pc) return;
            const log = () => {
                console.log('[' + label + '] ice=' + pc.iceConnectionState + ' conn=' + pc.connectionState);
                // Приёмный пир умер — значит входящих дорожек больше не будет.
                if (label === 'sub' && (pc.connectionState === 'failed' || pc.connectionState === 'closed')) {
                    removeAllRemote('subscriber pc ' + pc.connectionState);
                }
            };
            pc.addEventListener('iceconnectionstatechange', log);
            pc.addEventListener('connectionstatechange', log);
            pc.addEventListener('track', (ev) => console.log('[' + label + '] pc.track event:', ev.track.kind));
        }

        function errText(err) {
            if (!err) return 'неизвестная ошибка';
            if (typeof err === 'string') return err;
            return err.message || err.reason || JSON.stringify(err);
        }

        // Кнопка «Отключиться» в разметке скрыта (style="display:none"), поэтому её
        // нужно явно показывать после входа в комнату. Держим обе кнопки в одном
        // месте, чтобы состояния не разъезжались.
        function setConnectedUi(connected) {
            const joinBtn = document.getElementById('joinBtn');
            const leaveBtn = document.getElementById('leaveBtn');
            joinBtn.style.display = connected ? 'none' : 'inline-block';
            joinBtn.disabled = false;
            leaveBtn.style.display = connected ? 'inline-block' : 'none';
            leaveBtn.disabled = false;
            document.getElementById('qualitySelect').disabled = connected;
        }

        document.getElementById('joinBtn').onclick = async () => {
            const btn = document.getElementById('joinBtn');
            if (btn.disabled) return;
            btn.disabled = true;
            try {
                setStatus('Подключение...');

                const quality = document.getElementById('qualitySelect').value;
                const videoConstraints = qualityPresets[quality];

                const local = await acquireLocalStream(videoConstraints);
                if (local) {
                    localStream = local;
                    addVideo('local', local, true);
                }

                const signalUrl = 'wss://' + location.hostname + ':8443/ws';
                console.log('Connecting to signal at:', signalUrl);

                signal = new IonSFUJSONRPCSignal(signalUrl);
                await waitSignalOpen(signal);

                client = new Client(signal);
                window.__client = client;      // доступ из консоли браузера для отладки
                window.__remoteStreams = remoteStreams;

                // Наш сокет закрылся (закрыли вкладку/потеряли сеть/SFU перезапустили) —
                // входящие дорожки больше не придут, чистим все чужие фреймы.
                signal.onclose = (e) => {
                    console.log('Signaling closed, code=' + e.code);
                    removeAllRemote('signaling closed (code ' + e.code + ')');
                    // При штатном leave() ссылки уже сняты и UI переключит сам leave().
                    if (client) {
                        setStatus('Соединение с SFU потеряно');
                        setConnectedUi(false);
                    }
                };

                client.ontrack = (track, stream) => {
                    console.log('Remote track received:', track.kind, 'stream id:', stream && stream.id);

                    const hasStream = !!(stream && stream.id);
                    const key = hasStream ? stream.id : 'remote-' + track.id;
                    const media = hasStream ? stream : new MediaStream([track]);

                    let rec = remoteStreams.get(key);
                    if (!rec) {
                        rec = { stream: media, tracks: new Set(), mutedAt: 0 };
                        remoteStreams.set(key, rec);
                        // SFU пересогласовал приёмный пир и выкинул дорожку из потока
                        media.onremovetrack = (ev) => {
                            console.log('Stream removetrack:', ev.track.kind, key);
                            dropTrack(key, ev.track, 'stream removetrack');
                        };
                        media.onaddtrack = (ev) => watchTrack(key, rec, ev.track);
                    }
                    watchTrack(key, rec, track);
                    addVideo(key, media);
                };
                client.onerrnegotiate = (role, err) => {
                    console.error('Negotiation error [role=' + role + ']:', err);
                };
                client.ondatachannel = (ev) => console.log('App data channel:', ev.channel.label);

                // join() резолвится только после того, как SFU откроет служебный data-channel
                // "ion-sfu". Держим это на виду, но не даём зависнуть молча.
                const joinPromise = client.join(roomId, 'user-' + Math.random().toString(36).slice(2, 8));
                const apiTimeout = new Promise((resolve) => setTimeout(() => resolve('api-wait'), 6000));
                const joinState = await Promise.race([joinPromise.then(() => 'joined'), apiTimeout]);
                console.log('join() state:', joinState);

                watchPeer('pub', client.transports && client.transports[0] && client.transports[0].pc);
                watchPeer('sub', client.transports && client.transports[1] && client.transports[1].pc);

                if (joinState !== 'joined') {
                    setStatus('Подключено, жду служебный канал SFU...');
                }

                if (local) {
                    client.publish(local);
                    const kinds = local.getTracks().map((t) => t.kind);
                    console.log('Published. Локальные дорожки:', kinds.join(', ') || 'нет');
                    if (!kinds.includes('audio')) {
                        console.warn('Внимание: аудиодорожки нет — вас не услышат');
                    }
                    setStatus('В эфире');
                } else {
                    console.log('Joined in receive-only mode');
                    setStatus('Режим только приёма');
                }

                // Мы в комнате — показываем «Отключиться», прячем «Присоединиться»
                setConnectedUi(true);

            } catch (err) {
                console.error('Join failed:', err);
                setStatus('Ошибка: ' + errText(err));
                setConnectedUi(false);
            }
        };

        // Метод get-or-create для каждого узла, а не для обёртки целиком:
        // <video> и таблица статистики создаются независимо, поэтому частичное
        // удаление не может оставить «пустую» обёртку без видео.
        function addVideo(id, stream, isLocal) {
            let wrapper = document.getElementById('wrapper-' + id);
            if (!wrapper) {
                wrapper = document.createElement('div');
                wrapper.id = 'wrapper-' + id;
                wrapper.style.cssText = 'display:inline-block; margin:4px; vertical-align:top;';
                document.getElementById('videos').appendChild(wrapper);
            }

            let el = document.getElementById('video-' + id);
            if (!el) {
                el = document.createElement('video');
                el.id = 'video-' + id;
                el.autoplay = true;
                el.playsInline = true;
                el.volume = 1;
                wrapper.appendChild(el);
            }

            if (!isLocal && !document.getElementById('stats-' + id)) {
                const statsDiv = document.createElement('div');
                statsDiv.id = 'stats-' + id;
                statsDiv.style.cssText = 'font-size:12px; color:#333; background:#f0f0f0; padding:4px; margin-top:4px; border-radius:4px; font-family:monospace; white-space:pre;';
                wrapper.appendChild(statsDiv);
            }

            // Гасим только собственное превью — иначе будет эхо/вой. Удалённые потоки
            // обязаны звучать. muted ставим и атрибутом, и свойством, и повторяем после
            // srcObject: Chrome сбрасывает свойство на значение атрибута при загрузке.
            if (isLocal) {
                el.setAttribute('muted', '');
            } else {
                el.removeAttribute('muted');
            }
            el.muted = !!isLocal;
            // ontrack приходит отдельно на audio и на video одной и той же MediaStream.
            // Повторное присвоение того же объекта прерывает запущенный play()
            // с AbortError, поэтому переприсваиваем только при реальной смене потока.
            if (el.srcObject !== stream) el.srcObject = stream;
            el.muted = !!isLocal;
            if (!isLocal && el.paused) playWithSound(el);
            return el;
        }
        // Хранит предыдущие значения для расчёта битрейта и fps
        const prevStats = new Map();

        async function collectStats(streamKey) {
            if (!client || !client.transports) return;

            const subPc = client.transports[1] && client.transports[1].pc;
            if (!subPc) return;

            const rec = remoteStreams.get(streamKey);
            if (!rec) return;

            // inbound-rtp выбираем по trackIdentifier именно этого потока.
            // Иначе на 2+ участниках каждая плитка показывала бы первый попавшийся
            // видеопоток со всего sub-пира, то есть одни и те же цифры.
            const trackIds = new Set(Array.from(rec.tracks).map((t) => t.id));
            const mine = (stat) => trackIds.size === 0 || trackIds.has(stat.trackIdentifier);

            try {
                const report = await subPc.getStats();
                let videoStats = null;
                let audioStats = null;
                let rtt = null;
                let jitter = null;
                let packetsLost = null;

                report.forEach((stat) => {
                    // Ищем входящие видео и аудио потоки этого участника
                    if (stat.type === 'inbound-rtp' && mine(stat)) {
                        if (stat.kind === 'video' && !videoStats) videoStats = stat;
                        if (stat.kind === 'audio' && !audioStats) {
                            audioStats = stat;
                            // Jitter и потери пакетов берём из audio (для видео часто undefined)
                            if (stat.jitter !== undefined) jitter = stat.jitter;
                            if (stat.packetsLost !== undefined) packetsLost = stat.packetsLost;
                        }
                    }
                    // RTT ищем в candidate-pair (транспортном уровне)
                    if (stat.type === 'candidate-pair' && stat.state === 'succeeded') {
                        if (stat.currentRoundTripTime !== undefined) {
                            rtt = stat.currentRoundTripTime * 1000; // в мс
                        }
                    }
                });

                // --- Расчёт битрейта (Mbps) ---
                const now = performance.now();
                const key = 'stats_' + streamKey;
                const prev = prevStats.get(key) || {};
                
                let videoBitrate = '—';
                let audioBitrate = '—';
                let fps = '—';
                let resolution = '—';

                if (videoStats) {
                    if (prev.videoBytes !== undefined) {
                        const dt = (now - prev.timestamp) / 1000;
                        const dBytes = videoStats.bytesReceived - prev.videoBytes;
                        videoBitrate = ((dBytes * 8) / dt / 1000000).toFixed(2) + ' Mbps';
                    }
                    // fps из framesPerSecond (если есть) или рассчитываем
                    if (videoStats.framesPerSecond !== undefined) {
                        fps = videoStats.framesPerSecond;
                    } else if (prev.videoFrames !== undefined) {
                        const dt = (now - prev.timestamp) / 1000;
                        fps = Math.round((videoStats.framesDecoded - prev.videoFrames) / dt);
                    }
                    // Разрешение
                    if (videoStats.frameWidth && videoStats.frameHeight) {
                        resolution = videoStats.frameWidth + 'x' + videoStats.frameHeight;
                    }
                }

                if (audioStats && prev.audioBytes !== undefined) {
                    const dt = (now - prev.timestamp) / 1000;
                    const dBytes = audioStats.bytesReceived - prev.audioBytes;
                    audioBitrate = ((dBytes * 8) / dt / 1000).toFixed(0) + ' kbps';
                }

                // Сохраняем текущие значения для следующего расчёта
                prevStats.set(key, {
                    timestamp: now,
                    videoBytes: videoStats ? videoStats.bytesReceived : undefined,
                    videoFrames: videoStats ? videoStats.framesDecoded : undefined,
                    audioBytes: audioStats ? audioStats.bytesReceived : undefined,
                });

                // --- Обновляем DOM ---
                const statsEl = document.getElementById('stats-' + streamKey);
                if (!statsEl) return;

                statsEl.innerHTML = `
                    <div>RTT: ${rtt !== null ? rtt.toFixed(0) + ' ms' : '—'}</div>
                    <div>Res: ${resolution}</div>
                    <div>Video: ${videoBitrate}</div>
                    <div>FPS: ${fps}</div>
                    <div>Jitter: ${jitter !== null ? (jitter * 1000).toFixed(1) + ' ms' : '—'}</div>
                    <div>Audio: ${audioBitrate}</div>
                    <div>Lost: ${packetsLost !== null ? packetsLost : '—'}</div>
                `;
            } catch (err) {
                console.warn('Stats error for', streamKey, err);
            }
        }

        // Периодический сбор статистики для всех удалённых потоков
        setInterval(() => {
            remoteStreams.forEach((rec, key) => {
                collectStats(key);
            });
        }, 1000);


        async function leave() {
            const btn = document.getElementById('leaveBtn');
            if (btn.disabled) return;
            btn.disabled = true;
            setStatus('Отключение...');

            // 1) Останавливаем свои треки — гасим индикатор камеры и микрофона
            if (localStream) {
                localStream.getTracks().forEach((t) => t.stop());
                localStream = null;
            }

            // 2) Отвязываем и убираем свой <video> вместе с обёрткой
            const localEl = document.getElementById('video-local');
            if (localEl) {
                localEl.pause();
                localEl.srcObject = null;
                localEl.load();
            }
            const localWrap = document.getElementById('wrapper-local');
            if (localWrap) {
                localWrap.remove();
            } else if (localEl) {
                localEl.remove();
            }

            // 3) Чистим все чужие фреймы
            removeAllRemote('leave() called');

            // 4) Закрываем PeerConnection-ы и сигнализацию
            try {
                if (client && typeof client.leave === 'function') {
                    await client.leave();
                }
            } catch (err) {
                console.warn('client.leave() failed:', err);
            }
            try {
                if (client && typeof client.close === 'function') {
                    client.close();
                }
            } catch (err) {
                console.warn('client.close() failed:', err);
            }
            try {
                if (signal && typeof signal.close === 'function') {
                    signal.close();
                }
            } catch (err) {
                console.warn('signal.close() failed:', err);
            }

            // 5) Снимаем ссылки
            client = null;
            signal = null;
            window.__client = null;
            window.__remoteStreams = null;

            // 6) Возвращаем UI в исходное состояние
            setStatus('Отключено');
            setConnectedUi(false);
        }

        document.getElementById('leaveBtn').onclick = leave;
        // Браузер может отложить автовоспроизведение со звуком. AbortError — это
        // гонка с пересогласованием SDP, её просто повторяем. Настоящую блокировку
        // автоплея снимаем при первом же взаимодействии со страницей.
        function playWithSound(el, attempt) {
            const tries = attempt || 0;
            const p = el.play();
            if (!p || !p.catch) return;
            p.catch((err) => {
                if (err && err.name === 'AbortError' && tries < 3) {
                    setTimeout(() => playWithSound(el, tries + 1), 150);
                    return;
                }
                console.warn('Autoplay blocked for', el.id, err && err.name);
                const unlock = () => {
                    el.play().then(() => console.log('Playback unlocked by user gesture:', el.id))
                        .catch(() => {});
                    document.removeEventListener('pointerdown', unlock);
                    document.removeEventListener('keydown', unlock);
                };
                document.addEventListener('pointerdown', unlock);
                document.addEventListener('keydown', unlock);
            });
        }
    </script>
</body>
</html>
